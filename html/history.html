<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="History reader from the LaymyoChin app, presented as a single-title single-body page.">
  <title>LaymyoChin Web | History</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script defer src="../js/nav.js"></script>
  <script defer src="../js/history.js"></script>
</head>
<body>
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="LaymyoChin Web home">
        <img src="../assets/images/logo.png" alt="" class="brand-mark">
        <span>
          <strong>LaymyoChin Web</strong>
          <small>Dictionary · Learning Hub</small>
        </span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="dictionary">Dictionary</a>
        <a href="history" aria-current="page">History</a>
        <div class="nav-menu">
          <button class="nav-menu-toggle" type="button" aria-expanded="false" aria-haspopup="true" aria-label="More pages">
            <span class="nav-menu-label">More</span>
            <span class="nav-hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
          </button>
          <div class="nav-menu-panel" role="menu" aria-label="More pages">
            <a href="/#alphabet" role="menuitem">Learn Grammar</a>
            <a href="conversation" role="menuitem">Basic Conversation</a>
            <a href="categories" role="menuitem">Learn with Categories</a>
            <a href="about" role="menuitem">About Us</a>
          </div>
        </div>
        <a class="profile-link" href="profile" aria-label="Profile">
          <img src="../assets/images/profile.png" alt="" class="profile-avatar">
          <span>Profile</span>
        </a>
      </nav>
    </header>

    <main>
      <section class="history-reader-shell card reveal">
        <div class="history-reader-top">
          <button class="button button-secondary button-icon" type="button" id="openHistoryMenu" aria-controls="historyMenu" aria-expanded="false">
            <span class="menu-icon" aria-hidden="true">☰</span>
            Titles
          </button>
          <div class="history-reader-count" id="historyCount">0 titles</div>
        </div>

        <article class="history-reader card">
          <div class="history-reader-title" id="historyActiveTitle">Loading...</div>
          <pre class="history-reader-body" id="historyActiveBody">Loading history text...</pre>
        </article>
      </section>
    </main>
  </div>

  <div class="history-menu-backdrop" id="historyMenuBackdrop" hidden></div>
  <aside class="history-menu card" id="historyMenu" aria-label="History section menu" aria-hidden="true">
    <div class="history-menu-head">
      <div>
        <div class="eyebrow">History menu</div>
        <strong>Choose a title</strong>
      </div>
      <button class="icon-button" type="button" id="closeHistoryMenu" aria-label="Close history menu">×</button>
    </div>
    <div class="history-menu-list" id="historyMenuList"></div>
  </aside>

  <div class="floating-cta" aria-label="Quick actions">
    <a class="floating-cta-link floating-cta-app" href="https://play.google.com/store/apps/details?id=chin.bk.hleihzue.yet.dictionary" target="_blank" rel="noreferrer noopener">
      <span class="floating-cta-kicker">Get the app</span>
      <strong>Install LaymyoChin</strong>
    </a>
    <a class="floating-cta-link floating-cta-join" href="/#community">
      <span class="floating-cta-kicker">Join contribution</span>
      <strong>Help improve the project</strong>
    </a>
  </div>
</body>
</html>
